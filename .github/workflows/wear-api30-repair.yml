name: Wear API 30 repair

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build signed Wear APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Prepare signing key
        env:
          S_KEYSTORE_SET: ${{ secrets.KEYSTORE_SET }}
          S_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          S_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          S_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          S_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: python
        run: |
          import base64
          import os
          import secrets
          from pathlib import Path

          names = ['KEYSTORE_BASE64', 'KEYSTORE_PASSWORD', 'KEY_ALIAS', 'KEY_PASSWORD']
          packed = os.environ.get('S_KEYSTORE_SET', '')
          if packed:
              values = base64.b64decode(packed, validate=True).decode('utf-8').split('|')
              if len(values) != 4:
                  raise SystemExit('KEYSTORE_SET must contain four fields')
          else:
              values = [os.environ.get('S_' + name, '') for name in names]
          if not all(values):
              raise SystemExit('The existing signing secrets are incomplete')

          for value in values:
              escaped = value.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::add-mask::' + escaped, flush=True)

          key_file = Path(os.environ['RUNNER_TEMP']) / 'wear-repair.jks'
          key_file.write_bytes(base64.b64decode(values[0]))
          key_file.chmod(0o600)
          env_values = dict(zip(names[1:], values[1:]))
          env_values['WEAR_SIGNING_FILE'] = str(key_file)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              for name, value in env_values.items():
                  delimiter = 'WEAR_' + secrets.token_hex(16)
                  output.write(f'{name}<<{delimiter}\n{value}\n{delimiter}\n')

      - name: Build Wear only
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :wear:assembleFullRelease --no-daemon --console=plain \
            -Dorg.gradle.jvmargs="-Xmx6g -XX:+UseParallelGC -Xss4m" \
            -Dorg.gradle.workers.max=2 \
            -Pandroid.injected.signing.store.file="$WEAR_SIGNING_FILE" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Save signed Wear APK
        uses: actions/upload-artifact@v4
        with:
          name: AAPS-Wear-4.0.0-api30-repair
          path: wear/build/outputs/apk/full/release/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Remove temporary signing key
        if: always()
        shell: python
        run: |
          import os
          from pathlib import Path
          (Path(os.environ['RUNNER_TEMP']) / 'wear-repair.jks').unlink(missing_ok=True)
